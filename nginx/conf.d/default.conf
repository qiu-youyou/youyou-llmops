# ==========================================
# LLMOps - Nginx Reverse Proxy
# Cloudflare Tunnel + Docker
# ==========================================

# Vue Frontend
upstream llmops_web {
    zone llmops_web 64k;
    server llmops-web:3000 resolve;
}

# Flask Backend
upstream llmops_api {
    zone llmops_api 64k;
    server llmops-api:5001 resolve;
}

server {
    listen 80;
    server_name llmops.qiuyouyou.cn;

    # Maximum upload size
    client_max_body_size 20m;

    # --------------------------------------
    # Flask API
    # --------------------------------------

    location = /api {
        return 308 /api/$is_args$args;
    }

    location ^~ /api/ {
        include /etc/nginx/proxy.conf;

        # Remove /api/ prefix before forwarding
        proxy_pass http://llmops_api/;

        # SSE / Streaming
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }

    # --------------------------------------
    # Vue Frontend
    # --------------------------------------

    location / {
        include /etc/nginx/proxy.conf;

        proxy_pass http://llmops_web;
    }
}