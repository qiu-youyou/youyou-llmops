services:
  llmops-nginx:
    image: nginx:stable-alpine
    container_name: ${PROJECT_NAME:-youyou-llmops}-nginx
    restart: unless-stopped
    ports:
      - '127.0.0.1:9001:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - llmops-web
      - llmops-api
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ${PROJECT_NAME:-youyou-llmops}-cloudflared
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - llmops-nginx
  llmops-web:
    image: ${PROJECT_NAME:-youyou-llmops}-web:0.1.0
    build:
      context: .
      dockerfile: llmops-web/Dockerfile
      args:
        WEB_API_BASE_URL: /api
    container_name: ${PROJECT_NAME:-youyou-llmops}-web
    restart: unless-stopped
    expose:
      - '3000'

  llmops-api:
    image: ${PROJECT_NAME:-youyou-llmops}-api:0.1.0
    build:
      context: .
      dockerfile: llmops-api/Dockerfile
    container_name: ${PROJECT_NAME:-youyou-llmops}-api
    restart: unless-stopped
    env_file:
      - ./llmops-api/.env
    expose:
      - '5001'
    volumes:
      - ./volumes/app/storage:/app/storage
      - ./volumes/app/embeddings:/app/internal/core/embeddings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_started
    stop_grace_period: 60s

  llmops-celery:
    image: ${PROJECT_NAME:-youyou-llmops}-api:0.1.0
    build:
      context: .
      dockerfile: llmops-api/Dockerfile
    container_name: ${PROJECT_NAME:-youyou-llmops}-celery
    restart: unless-stopped
    env_file:
      - ./llmops-api/.env
      - ./llmops-api/.env.celery
    volumes:
      - ./volumes/app/storage:/app/storage
      - ./volumes/app/embeddings:/app/internal/core/embeddings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_started
    stop_grace_period: 60s

  postgres:
    image: postgres:17-alpine
    container_name: ${PROJECT_NAME:-youyou-llmops}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: llmops
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./volumes/postgres/data:/var/lib/postgresql/data
      # 初始化脚本空数据下挂载（.sql/.sh）
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d llmops']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '127.0.0.1:15432:5432'

  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME:-youyou-llmops}-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - ./volumes/redis/data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '127.0.0.1:16379:6379'
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.34.4
    container_name: ${PROJECT_NAME:-youyou-llmops}-weaviate
    restart: unless-stopped
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'false' # 需要授权 不允许匿名访问
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: 'none' # 向量化模块为none
      CLUSTER_HOSTNAME: node1 # 节点的主机名字
      AUTHENTICATION_APIKEY_ENABLED: 'true' # 启用API密钥校验
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY}
      AUTHENTICATION_APIKEY_USERS: 'llmops@test.com' # 基于密钥的API身份列表
      AUTHORIZATION_ADMINLIST_ENABLED: 'true' # Adminlist 授权方案
      AUTHORIZATION_ADMINLIST_ROOT_USERS: 'llmops@test.com' # Adminlist的身份
      AUTHORIZATION_ADMINLIST_USERS: 'llmops@test.com'
    volumes:
      - ./volumes/weaviate:/var/lib/weaviate
    ports:
      - '127.0.0.1:18080:8080'
      - '127.0.0.1:50051:50051'
